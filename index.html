<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Structures of Influence: Categorization Explorer</title>
<style>
:root{
  --bg:#020402; --panel:#06100a; --line:#12391f; --dim:#2f9a52; --text:#55e07d; --hi:#a8ffc2;
  --warn:#e0c455; --bad:#e07a55; --mono:"DejaVu Sans Mono","Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--mono)}
a{color:var(--hi)}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 24px;align-items:baseline}
header h1{margin:0;font-size:17px;font-weight:600;color:var(--hi);letter-spacing:.04em}
header .sub{color:var(--dim)}
nav{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);padding:0 12px}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);font:inherit;padding:9px 14px;cursor:pointer}
nav button:hover{color:var(--text)}
nav button.on{color:var(--hi);border-bottom-color:var(--text)}
main{padding:18px 20px;max-width:1700px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 14px}
label{color:var(--dim)}
select,input[type=text],input[type=search],button.btn{background:var(--panel);color:var(--text);border:1px solid var(--line);font:inherit;padding:5px 8px;border-radius:2px}
select{max-width:520px}
button.btn{cursor:pointer}
button.btn:hover{border-color:var(--text);color:var(--hi)}
input[type=file]{color:var(--dim);font:inherit}
h2{font-size:15px;margin:22px 0 8px;color:var(--hi);font-weight:600}
.note{color:var(--dim);max-width:110ch}
.warn{border:1px solid var(--warn);color:var(--warn);padding:8px 12px;margin:0 0 14px;max-width:120ch}
.bad{border:1px solid var(--bad);color:var(--bad);padding:8px 12px;margin:0 0 14px;max-width:120ch}
.unavail{border:1px dashed var(--line);color:var(--dim);padding:18px;max-width:100ch}
table{border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:3px 8px;text-align:left;vertical-align:top}
th{color:var(--hi);font-weight:600;background:var(--panel)}
td.num,th.num{text-align:right}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--panel);padding:10px 12px}
.card h3{margin:0 0 4px;font-size:14px;color:var(--hi)}
.terms{color:var(--text);margin:6px 0}
.terms span{display:inline-block;margin:0 8px 2px 0}
.meta{color:var(--dim);font-size:12px}
.pass{border-left:2px solid var(--line);padding:4px 0 4px 12px;margin:0 0 14px;max-width:120ch}
.pass .hd{color:var(--dim);font-size:12px;margin-bottom:3px}
.pass .tx{white-space:pre-wrap;word-wrap:break-word}
mark{background:#1d5a30;color:var(--hi)}
.split{display:grid;grid-template-columns:minmax(0,auto) minmax(320px,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.scroll{overflow:auto;max-height:78vh;border:1px solid var(--line)}
canvas{display:block}
.bar{height:11px;background:var(--text);opacity:.8}
.tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--text);padding:3px 8px;z-index:9;display:none;font-size:12px;max-width:520px}
input.lab{width:100%;margin-top:4px}
.small{font-size:12px}
</style>
</head>
<body>
<header>
  <h1>STRUCTURES OF INFLUENCE / CATEGORIZATION EXPLORER</h1>
  <span class="sub" id="runinfo">no run loaded</span>
</header>
<nav id="nav"></nav>
<main id="panel"></main>
<div class="tip" id="tip"></div>

<script>
"use strict";
/* Offline viewer for categorization-results/RUN_ID. No network, no framework.
   Nothing is displayed unless it was read from the loaded files. */

const EXPECTED = ["manifest.json","report.json","documents.csv","passages.csv","topics.csv","topic_terms.csv",
  "passage_topics.csv","document_topics.csv","document_similarity.csv","document_terms.csv",
  "topic_concordances.csv","stability.csv"];
const TABS = [["overview","Overview"],["topics","Topics"],["heatmap","Lecture x topic"],["similarity","Similarity"],
  ["chrono","Chronology"],["conc","Concordance"],["models","Model comparison"]];

const S = {raw:{}, tab:"overview", model:null, runId:null, warnings:[], ix:null, runsFound:null,
           conc:{q:"",scope:"",topic:"",exact:true,cs:false}, heat:{sort:"date",topic:"T00",lec:"",norm:true},
           chrono:{view:"norm",topic:"T00"}, sim:{lec:"",key:""}};

/* ---------- helpers ---------- */
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(k==="class") e.className = v;
    else if(k==="on") for(const [ev,fn] of Object.entries(v)) e.addEventListener(ev,fn);
    else if(k==="style") e.style.cssText = v;
    else if(v===true) e.setAttribute(k,"");
    else if(v!==false && v!=null) e.setAttribute(k,v);
  }
  for(const kid of kids.flat(Infinity)){
    if(kid==null||kid===false) continue;
    e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return e;
}
function fmtTime(s){s=Math.floor(+s);const hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;
  return (hh?hh+":":"")+String(mm).padStart(hh?2:1,"0")+":"+String(ss).padStart(2,"0");}
function ytLink(vid,start){
  const u = "https://www.youtube.com/watch?v="+encodeURIComponent(vid)+"&t="+Math.floor(+start)+"s";
  return h("a",{href:u,target:"_blank",rel:"noopener noreferrer"},"open at "+fmtTime(start));
}
function parseCSV(text){
  const rows=[]; let row=[],f="",q=false,i=0; const n=text.length;
  if(text.charCodeAt(0)===0xFEFF) i=1;
  for(;i<n;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c;
    } else if(c==='"') q=true;
    else if(c===","){row.push(f);f="";}
    else if(c==="\n"){row.push(f);rows.push(row);row=[];f="";}
    else if(c!=="\r") f+=c;
  }
  if(f.length||row.length){row.push(f);rows.push(row);}
  if(!rows.length) return {header:[],rows:[]};
  const header=rows[0]; const out=[];
  for(let r=1;r<rows.length;r++){ if(rows[r].length===1&&rows[r][0]==="") continue;
    const o={}; for(let c=0;c<header.length;c++) o[header[c]]=rows[r][c]??""; out.push(o); }
  return {header,rows:out};
}
function unavailable(...names){
  const miss = names.filter(n=>!S.raw[n]);
  if(!miss.length) return null;
  return h("div",{class:"unavail"},"Unavailable: "+miss.join(", ")+" not loaded. Nothing is shown in its place.");
}
function tip(ev,txt){const t=document.getElementById("tip"); if(!txt){t.style.display="none";return;}
  t.textContent=txt; t.style.display="block"; t.style.left=Math.min(ev.clientX+14,innerWidth-340)+"px"; t.style.top=(ev.clientY+14)+"px";}
function modelLabel(m){return "K="+m.K+"  "+m.kind+"  "+m.id;}

/* ---------- loading ---------- */
async function loadFileList(files){
  const byDir = {};
  for(const f of files){
    const rel = f.webkitRelativePath || f.name;
    const dir = rel.includes("/") ? rel.slice(0, rel.lastIndexOf("/")) : "";
    if(EXPECTED.includes(f.name)) (byDir[dir] = byDir[dir] || {})[f.name] = f;
  }
  const dirs = Object.keys(byDir).filter(d=>byDir[d]["manifest.json"]||byDir[d]["documents.csv"]);
  if(!dirs.length && !Object.keys(byDir).length){ alert("No recognised report files in the selection."); return; }
  const use = dirs.length ? dirs : Object.keys(byDir);
  S.runsFound = {dirs:use, byDir};
  await openRun(use.sort().slice(-1)[0]);
}
async function openRun(dir){
  const group = S.runsFound.byDir[dir]; S.raw = {}; S.warnings = [];
  for(const [name,f] of Object.entries(group)){
    try{
      const text = await f.text();
      if(name.endsWith(".json")) S.raw[name] = JSON.parse(text);
      else { const p = parseCSV(text); S.raw[name] = p; }
    }catch(e){ S.warnings.push("Could not read "+name+": "+e.message); }
  }
  const ids = new Set();
  for(const [n,v] of Object.entries(S.raw)) if(v.rows && v.rows.length && "run_id" in v.rows[0]) ids.add(v.rows[0].run_id);
  if(S.raw["manifest.json"]) ids.add(S.raw["manifest.json"].run_id);
  S.runId = [...ids][0] || null;
  if(ids.size>1) S.warnings.push("Files carry different run identifiers ("+[...ids].join(", ")+"). They come from different runs and should not be combined.");
  buildIndex();
  S.tab = "overview"; render();
}

function buildIndex(){
  const R = S.raw, ix = {};
  const rows = n => (R[n] ? R[n].rows : []);
  ix.docs = rows("documents.csv").slice().sort((a,b)=>a.upload_date<b.upload_date?-1:a.upload_date>b.upload_date?1:a.video_id<b.video_id?-1:1);
  ix.docById = Object.fromEntries(ix.docs.map(d=>[d.video_id,d]));
  ix.passages = rows("passages.csv");
  ix.passById = Object.fromEntries(ix.passages.map(p=>[p.passage_id,p]));
  ix.passByVid = {};
  for(const p of ix.passages) (ix.passByVid[p.video_id] = ix.passByVid[p.video_id]||[]).push(p);
  const models = {};
  for(const t of rows("topics.csv")){
    const m = models[t.model_id] = models[t.model_id] || {id:t.model_id,K:+t.n_topics,kind:t.model_kind,parent:t.parent_model_id,topics:[]};
    m.topics.push(t);
  }
  ix.models = Object.values(models).sort((a,b)=>a.K-b.K||(a.kind<b.kind?-1:1));
  for(const m of ix.models) m.topics.sort((a,b)=>a.topic_id<b.topic_id?-1:1);
  ix.terms = {};
  for(const t of rows("topic_terms.csv")){
    const mm = ix.terms[t.model_id] = ix.terms[t.model_id] || {};
    (mm[t.topic_id] = mm[t.topic_id] || []).push({term:t.term,weight:+t.weight,rank:+t.rank});
  }
  ix.dt = {};
  for(const r of rows("document_topics.csv")){
    const mm = ix.dt[r.model_id] = ix.dt[r.model_id] || {};
    const d = mm[r.video_id] = mm[r.video_id] || {w:{},assigned:+r.assigned_words,elig:+r.eligible_words,status:r.status};
    d.w[r.topic_id] = +r.weight;
  }
  ix.pt = {};
  for(const r of rows("passage_topics.csv")){
    const mm = ix.pt[r.model_id] = ix.pt[r.model_id] || {};
    (mm[r.passage_id] = mm[r.passage_id] || {})[r.topic_id] = +r.weight;
  }
  ix.conc = {};
  for(const r of rows("topic_concordances.csv")){
    const k = r.model_id+"|"+r.topic_id; (ix.conc[k] = ix.conc[k]||[]).push(r);
  }
  ix.simKeys = {};
  for(const r of rows("document_similarity.csv")){
    const key = r.method+" | "+r.model_id;
    const s = ix.simKeys[key] = ix.simKeys[key] || {};
    (s[r.video_id_a] = s[r.video_id_a] || []).push([r.video_id_b,+r.similarity]);
    (s[r.video_id_b] = s[r.video_id_b] || []).push([r.video_id_a,+r.similarity]);
  }
  ix.docTerms = {};
  for(const r of rows("document_terms.csv")) (ix.docTerms[r.video_id] = ix.docTerms[r.video_id]||{})[r.term] = +r.weight;
  S.ix = ix;
  if(!S.model || !ix.models.find(m=>m.id===S.model)) S.model = ix.models.length ? ix.models[0].id : null;
  S.sim.key = Object.keys(ix.simKeys)[0] || "";
  S.sim.lec = ix.docs.length ? ix.docs[0].video_id : "";
  S.heat.lec = S.sim.lec;
}
function curModel(){ return S.ix ? S.ix.models.find(m=>m.id===S.model) : null; }
function topicLabel(mid, tid){
  const own = loadLabel(mid, tid); if(own) return own;
  const t = S.ix.models.find(m=>m.id===mid)?.topics.find(t=>t.topic_id===tid);
  return t && t.label ? t.label : "";
}
function loadLabel(mid,tid){ try{ return localStorage.getItem("soi|"+S.runId+"|"+mid+"|"+tid)||""; }catch(e){ return ""; } }
function saveLabel(mid,tid,v){ try{ if(v) localStorage.setItem("soi|"+S.runId+"|"+mid+"|"+tid,v); else localStorage.removeItem("soi|"+S.runId+"|"+mid+"|"+tid); }catch(e){} }

/* ---------- shell ---------- */
function render(){
  const nav = document.getElementById("nav"); nav.replaceChildren();
  for(const [id,label] of TABS) nav.append(h("button",{class:id===S.tab?"on":"",on:{click:()=>{S.tab=id;render();}}},label));
  document.getElementById("runinfo").textContent = S.runId ? "run "+S.runId : "no run loaded";
  const p = document.getElementById("panel"); p.replaceChildren();
  if(!S.ix){ p.append(loaderView()); return; }
  const fns = {overview,topics,heatmap,similarity,chrono,conc,models};
  p.append(modelBar());
  for(const w of S.warnings) p.append(h("div",{class:"warn"},w));
  p.append(fns[S.tab]());
}
function modelBar(){
  const ix = S.ix; if(S.tab==="overview"||!ix.models.length) return h("div");
  const sel = h("select",{on:{change:e=>{S.model=e.target.value;render();}}},
    ix.models.map(m=>h("option",{value:m.id,selected:m.id===S.model},modelLabel(m))));
  return h("div",{class:"row"},h("label",null,"Topic model"),sel,
    h("span",{class:"meta"},"Model topic IDs are neutral identifiers. Labels are investigator interpretations."));
}
function loaderView(){
  const wrap = h("div");
  wrap.append(h("p",{class:"note"},"Load a categorization run produced by nlp/pipeline.py export. Select the run folder (categorization-results/RUN_ID), or select individual report files. Everything stays in this browser tab; nothing is uploaded and nothing here is example data."));
  wrap.append(h("div",{class:"row"},
    h("label",null,"Run folder"),
    h("input",{type:"file",webkitdirectory:true,directory:true,on:{change:e=>loadFileList(e.target.files)}})));
  wrap.append(h("div",{class:"row"},
    h("label",null,"Individual files"),
    h("input",{type:"file",multiple:true,accept:".csv,.json",on:{change:e=>loadFileList(e.target.files)}})));
  wrap.append(h("p",{class:"note small"},"Expected files: "+EXPECTED.join(", ")+". A missing file makes the views that need it show as unavailable."));
  return wrap;
}

/* ---------- overview ---------- */
function overview(){
  const ix = S.ix, w = h("div");
  if(S.runsFound && S.runsFound.dirs.length>1){
    w.append(h("div",{class:"row"},h("label",null,"Run in selection"),
      h("select",{on:{change:e=>openRun(e.target.value)}}, S.runsFound.dirs.map(d=>h("option",{value:d,selected:S.runId&&d.endsWith(S.runId)},d||"(files)")))));
  }
  for(const x of S.warnings) w.append(h("div",{class:"warn"},x));
  const man = S.raw["manifest.json"], rep = S.raw["report.json"];
  w.append(h("h2",null,"Files"));
  w.append(h("table",null,h("tr",null,h("th",null,"File"),h("th",null,"Status"),h("th",{class:"num"},"Rows")),
    EXPECTED.map(n=>{ const v=S.raw[n]; return h("tr",null,h("td",null,n),
      h("td",{style:v?"":"color:var(--bad)"},v?"loaded":"unavailable"),h("td",{class:"num"},v&&v.rows?v.rows.length:""));})));
  w.append(h("div",{class:"row"},h("button",{class:"btn",on:{click:()=>{S.ix=null;S.raw={};S.runsFound=null;render();}}},"Load a different run")));
  if(man){
    w.append(h("h2",null,"Corpus snapshot"));
    const c = man.corpus;
    w.append(h("p",{class:"note"},"Corpus hash "+c.corpus_hash.slice(0,12)+"; "+c.included_documents.length+" lectures included. "+
      "Scope: "+c.scope.basis+". The complete channel history is not represented ("+c.scope.note+")"));
    w.append(h("p",{class:"note small"},"Pipeline "+man.pipeline_version+", executed "+man.executed_at+". Segmentation "+man.preprocessing.segmentation_version+
      ". Random seed "+man.nmf_config.seed+"."));
  } else w.append(unavailable("manifest.json"));
  if(rep){
    w.append(h("h2",null,"Counts"));
    w.append(h("table",null,Object.entries(rep.counts).map(([k,v])=>h("tr",null,h("td",null,k),h("td",{class:"num"},v)))));
    const bad = rep.models.filter(m=>m.converged===false);
    if(bad.length) w.append(h("div",{class:"warn",style:"margin-top:12px"},"NMF stopped at the iteration limit before reaching the convergence tolerance for: "+bad.map(m=>"K="+m.n_topics).join(", ")+". Weights are usable but a larger max_iter may change them slightly."));
    for(const m of rep.models){
      if(m.documents_unassigned.length) w.append(h("div",{class:"warn"},"K="+m.n_topics+": "+m.documents_unassigned.length+" lectures have no assigned passages and appear as unassigned."));
      if(m.topics_with_no_prominent_lecture.length) w.append(h("p",{class:"meta"},"K="+m.n_topics+": topics prominent in no lecture: "+m.topics_with_no_prominent_lecture.join(", ")));
    }
    w.append(h("h2",null,"Components"));
    w.append(h("table",null,Object.entries(rep.components).map(([k,v])=>h("tr",null,h("td",null,k),h("td",{style:v==="available"?"":"color:var(--dim)"},v)))));
    w.append(h("h2",null,"Reading these results"));
    w.append(h("ul",{class:"note"},rep.interpretation_constraints.map(x=>h("li",null,x))));
    if(rep.diagnostics.length){
      w.append(h("h2",null,"Ingestion diagnostics"));
      w.append(h("table",null,h("tr",null,h("th",null,"Status"),h("th",null,"Source file"),h("th",null,"Message")),
        rep.diagnostics.filter(d=>d.status!=="variant_skipped").map(d=>h("tr",null,h("td",null,d.status),h("td",null,d.source_path),h("td",null,d.message)))));
      const vs = rep.diagnostics.filter(d=>d.status==="variant_skipped").length;
      if(vs) w.append(h("p",{class:"meta"},vs+" duplicate subtitle variants were skipped; each video is counted once."));
    }
  } else w.append(unavailable("report.json"));
  return w;
}

/* ---------- passages ---------- */
function passageBlock(p, opts){
  opts = opts||{};
  const d = S.ix.docById[p.video_id] || {};
  const hd = [d.upload_date||"", d.title||p.video_id, "start "+fmtTime(p.start_seconds)];
  const box = h("div",{class:"pass"});
  const head = h("div",{class:"hd"}, hd.join("  |  ")+"  |  ", ytLink(p.video_id,p.start_seconds));
  box.append(head);
  if(opts.extra) box.append(h("div",{class:"hd"},opts.extra));
  if(p.excluded_from_content_analysis==="True") box.append(h("div",{class:"hd",style:"color:var(--warn)"},"excluded from topic modeling: "+p.exclusion_reason));
  const text = p.text, limit = opts.full?Infinity:900;
  const tx = h("div",{class:"tx"});
  if(opts.highlight){ tx.append(...highlightNodes(text.slice(0,limit),opts.highlight)); } else tx.append(text.slice(0,limit));
  if(text.length>limit){
    const more = h("a",{href:"#",on:{click:e=>{e.preventDefault();tx.replaceChildren(...(opts.highlight?highlightNodes(text,opts.highlight):[text]));}}}," [show full passage]");
    tx.append("...",more);
  }
  box.append(tx);
  return box;
}
function highlightNodes(text,re){
  const out=[]; let last=0; re.lastIndex=0; let m;
  while((m=re.exec(text))){ if(m[0]==="") {re.lastIndex++;continue;}
    out.push(text.slice(last,m.index)); out.push(h("mark",null,m[0])); last=m.index+m[0].length; }
  out.push(text.slice(last)); return out;
}

/* ---------- topics ---------- */
function topics(){
  const miss = unavailable("topics.csv","topic_terms.csv"); if(miss) return miss;
  const m = curModel(), w = h("div");
  const panel = h("div",{id:"topicpanel"});
  w.append(h("div",{class:"row"},h("button",{class:"btn",on:{click:exportLabels}},"Export labels as topic_labels.csv"),
    h("span",{class:"meta"},"Labels are saved in this browser only. Copy the exported file to categorization-results/ and rerun export to record them with the run.")));
  const grid = h("div",{class:"grid"});
  for(const t of m.topics){
    const terms = (S.ix.terms[m.id]||{})[t.topic_id]||[];
    const lab = h("input",{type:"text",class:"lab",placeholder:"investigator label (optional)",value:topicLabel(m.id,t.topic_id),
      on:{change:e=>saveLabel(m.id,t.topic_id,e.target.value.trim())}});
    grid.append(h("div",{class:"card"},
      h("h3",null,t.topic_id),
      h("div",{class:"meta"},"prominent in "+t.n_lectures_prominent+" lectures  |  dominant in "+t.n_passages_dominant+" passages"),
      h("div",{class:"terms"},terms.slice(0,14).map(x=>h("span",{title:"weight "+x.weight.toFixed(4),style:"cursor:pointer",on:{click:()=>{S.conc.q=x.term;S.conc.exact=true;S.tab="conc";render();}}},x.term))),
      lab,
      h("div",{class:"row",style:"margin:8px 0 0"},h("button",{class:"btn",on:{click:()=>{
        panel.replaceChildren(topicPassages(m.id,t.topic_id)); panel.scrollIntoView();}}},"representative passages"))));
  }
  w.append(grid, h("h2",null,"Passages"), panel);
  return w;
}
function topicPassages(mid,tid){
  const rows = (S.ix.conc[mid+"|"+tid]||[]);
  const w = h("div");
  w.append(h("p",{class:"note"},"Representative passages for "+tid+", ranked by raw NMF loading, at most 2 per lecture. They are the transcript text itself; read them before assigning a label."));
  if(!rows.length){ w.append(unavailable("topic_concordances.csv")); return w; }
  for(const r of rows){
    const p = S.ix.passById[r.passage_id] || {passage_id:r.passage_id,video_id:r.video_id,start_seconds:r.start_seconds,text:r.text};
    w.append(passageBlock(p,{extra:"rank "+r.rank+"  |  loading "+(+r.weight).toFixed(4)}));
  }
  return w;
}
function exportLabels(){
  const rows=[["model_id","topic_id","label","note"]];
  for(const m of S.ix.models) for(const t of m.topics){ const l = topicLabel(m.id,t.topic_id); if(l) rows.push([m.id,t.topic_id,l,""]); }
  const esc = v => /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
  const blob = new Blob([rows.map(r=>r.map(esc).join(",")).join("\n")+"\n"],{type:"text/csv"});
  const a = h("a",{href:URL.createObjectURL(blob),download:"topic_labels.csv"}); document.body.append(a); a.click(); a.remove();
}

/* ---------- heatmap ---------- */
function heatmap(){
  const miss = unavailable("documents.csv","document_topics.csv"); if(miss) return miss;
  const m = curModel(), ix = S.ix, K = m.K, tids = m.topics.map(t=>t.topic_id);
  const dtm = ix.dt[m.id]||{};
  let docs = ix.docs.filter(d=>dtm[d.video_id]);
  const w = h("div"), H = S.heat;
  const simKey = S.sim.key;
  const ctl = h("div",{class:"row"});
  const sortSel = h("select",{on:{change:e=>{H.sort=e.target.value;render();}}},
    [["date","publication date"],["topic","prevalence of a topic"],["similarity","similarity to a lecture"]].map(([v,l])=>h("option",{value:v,selected:H.sort===v},l)));
  ctl.append(h("label",null,"Sort by"),sortSel);
  if(H.sort==="topic") ctl.append(h("select",{on:{change:e=>{H.topic=e.target.value;render();}}},tids.map(t=>h("option",{value:t,selected:t===H.topic},t))));
  if(H.sort==="similarity") ctl.append(h("select",{on:{change:e=>{H.lec=e.target.value;render();}}},
    ix.docs.map(d=>h("option",{value:d.video_id,selected:d.video_id===H.lec},d.upload_date+"  "+d.title.slice(0,70)))));
  ctl.append(h("label",null,h("input",{type:"checkbox",checked:H.norm,on:{change:e=>{H.norm=e.target.checked;render();}}})," scale each topic column to its own maximum"));
  w.append(ctl);
  if(H.sort==="topic") docs.sort((a,b)=>(dtm[b.video_id].w[H.topic]||0)-(dtm[a.video_id].w[H.topic]||0));
  if(H.sort==="similarity"){
    const nb = new Map(((ix.simKeys[simKey]||{})[H.lec])||[]);
    if(!simKey) w.append(h("div",{class:"warn"},"document_similarity.csv is unavailable; sorting by date instead."));
    else { w.append(h("p",{class:"meta"},"Similarity method: "+simKey+". Lectures without an exported similarity to the selected lecture are placed last."));
      docs.sort((a,b)=>(nb.has(b.video_id)?nb.get(b.video_id):-1)-(nb.has(a.video_id)?nb.get(a.video_id):-1)); }
  }
  const labelW=420, cw=Math.max(22,Math.min(34,Math.floor(900/K))), rh=14, top=34;
  const colMax = tids.map(t=>Math.max(1e-9,...docs.map(d=>dtm[d.video_id].w[t]||0)));
  const gMax = Math.max(1e-9,...colMax);
  const cv = h("canvas"); const dpr = window.devicePixelRatio||1;
  const W = labelW+K*cw+10, Hh = top+docs.length*rh+6;
  cv.width=W*dpr; cv.height=Hh*dpr; cv.style.width=W+"px"; cv.style.height=Hh+"px";
  const g = cv.getContext("2d"); g.scale(dpr,dpr);
  g.font="12px "+getComputedStyle(document.body).fontFamily; g.textBaseline="middle";
  g.fillStyle="#a8ffc2"; tids.forEach((t,i)=>{ g.fillText(t,labelW+i*cw+2,top-12); });
  docs.forEach((d,r)=>{
    const y=top+r*rh, row=dtm[d.video_id];
    g.fillStyle="#2f9a52"; const lbl=(d.upload_date+"  "+d.title); g.fillText(lbl.length>58?lbl.slice(0,57)+"...":lbl,4,y+rh/2);
    if(row.status==="unassigned"){ g.fillStyle="#e07a55"; g.fillText("unassigned",labelW+2,y+rh/2); return; }
    tids.forEach((t,i)=>{
      const v=row.w[t]||0, a=Math.pow(Math.min(1,v/(H.norm?colMax[i]:gMax)),0.75);
      g.fillStyle="rgba(85,224,125,"+(0.04+0.96*a).toFixed(3)+")"; g.fillRect(labelW+i*cw,y+1,cw-2,rh-2);
    });
  });
  const hit = ev=>{ const b=cv.getBoundingClientRect(); const x=ev.clientX-b.left,y=ev.clientY-b.top;
    const r=Math.floor((y-top)/rh), c=Math.floor((x-labelW)/cw);
    if(r<0||r>=docs.length||c<0||c>=K) return null; return {d:docs[r],t:tids[c]}; };
  const detail = h("div");
  cv.addEventListener("mousemove",ev=>{const c=hit(ev); tip(ev,c?c.t+"  "+(dtm[c.d.video_id].w[c.t]||0).toFixed(3)+"  "+c.d.title.slice(0,80):null);});
  cv.addEventListener("mouseleave",()=>tip(null));
  cv.addEventListener("click",ev=>{const c=hit(ev); if(!c) return; detail.replaceChildren(cellPassages(m.id,c.d,c.t));});
  w.append(h("p",{class:"meta"},"Cell intensity is the word-weighted topic proportion for the lecture, a model-derived weight and not a measure of endorsement. Maximum cell value "+gMax.toFixed(3)+"."));
  w.append(h("div",{class:"split"},h("div",{class:"scroll"},cv),detail));
  detail.append(h("p",{class:"note"},"Click a cell to read the passages in that lecture most strongly associated with the topic."));
  return w;
}
function cellPassages(mid,d,tid){
  const ix=S.ix, ptm=ix.pt[mid]||{}, w=h("div");
  w.append(h("h2",{style:"margin-top:0"},tid+"  in  "+d.upload_date+"  "+d.title));
  const ps=(ix.passByVid[d.video_id]||[]).map(p=>({p,v:(ptm[p.passage_id]||{})[tid]||0})).sort((a,b)=>b.v-a.v);
  if(!ps.length || !ps.some(x=>x.v>0)) { w.append(h("p",{class:"note"},"No passage in this lecture has a nonzero weight for "+tid+".")); return w; }
  for(const {p,v} of ps.filter(x=>x.v>0).slice(0,6)){
    const all=ptm[p.passage_id]||{}; const tot=Object.values(all).reduce((a,b)=>a+b,0)||1;
    w.append(passageBlock(p,{extra:"loading "+v.toFixed(4)+"  |  share of passage "+(v/tot*100).toFixed(0)+"%"}));
  }
  return w;
}

/* ---------- similarity ---------- */
function similarity(){
  const miss = unavailable("documents.csv","document_similarity.csv"); if(miss) return miss;
  const ix=S.ix, w=h("div"), st=S.sim;
  const keys=Object.keys(ix.simKeys);
  if(!keys.length) return h("div",{class:"unavail"},"document_similarity.csv has no rows.");
  w.append(h("p",{class:"note"},"Similarity is cosine similarity under one representation. It shows shared vocabulary, not agreement, shared position or influence. Lexical (TF-IDF) similarity is the only method currently exported; semantic embeddings, when available, will appear as a separate method."));
  const row=h("div",{class:"row"});
  row.append(h("label",null,"Method"),h("select",{on:{change:e=>{st.key=e.target.value;render();}}},keys.map(k=>h("option",{value:k,selected:k===st.key},k))));
  row.append(h("label",null,"Lecture"),h("select",{on:{change:e=>{st.lec=e.target.value;render();}}},
    ix.docs.map(d=>h("option",{value:d.video_id,selected:d.video_id===st.lec},d.upload_date+"  "+d.title.slice(0,80)))));
  w.append(row);
  const nb=((ix.simKeys[st.key]||{})[st.lec]||[]).slice().sort((a,b)=>b[1]-a[1]);
  const seen=new Set(), list=[]; for(const x of nb){ if(!seen.has(x[0])){seen.add(x[0]);list.push(x);} }
  const detail=h("div");
  const t=h("table",null,h("tr",null,h("th",null,"#"),h("th",{class:"num"},"similarity"),h("th",null,"date"),h("th",null,"lecture")));
  list.slice(0,20).forEach(([vid,s],i)=>{ const d=ix.docById[vid]||{title:vid,upload_date:""};
    t.append(h("tr",{style:"cursor:pointer",on:{click:()=>{detail.replaceChildren(sharedTerms(st.lec,vid));}}},
      h("td",null,i+1),h("td",{class:"num"},s.toFixed(4)),h("td",null,d.upload_date),h("td",null,d.title))); });
  w.append(h("div",{class:"split"},t,detail));
  detail.append(h("p",{class:"note"},"Click a neighbour to see which terms contribute. Only each lecture's top terms are exported, so this list is a partial view of the contributing vocabulary."));
  return w;
}
function sharedTerms(a,b){
  const w=h("div"), A=S.ix.docTerms[a], B=S.ix.docTerms[b];
  w.append(h("h2",{style:"margin-top:0"},(S.ix.docById[a]||{}).title+"  vs  "+(S.ix.docById[b]||{}).title));
  if(!A||!B){ w.append(unavailable("document_terms.csv")); return w; }
  const sh=Object.keys(A).filter(t=>t in B).map(t=>[t,A[t]*B[t]]).sort((x,y)=>y[1]-x[1]);
  if(!sh.length) w.append(h("p",{class:"note"},"The two lectures share none of each other's exported top terms."));
  else w.append(h("table",null,h("tr",null,h("th",null,"shared term"),h("th",{class:"num"},"contribution")),
    sh.slice(0,25).map(([t,c])=>h("tr",null,h("td",null,t),h("td",{class:"num"},c.toFixed(5))))));
  return w;
}

/* ---------- chronology ---------- */
function chrono(){
  const miss = unavailable("documents.csv","document_topics.csv"); if(miss) return miss;
  const m=curModel(), ix=S.ix, dtm=ix.dt[m.id]||{}, tids=m.topics.map(t=>t.topic_id), K=m.K, C=S.chrono;
  const months={};
  for(const d of ix.docs){ const row=dtm[d.video_id]; if(!row||!d.upload_date) continue;
    const ym=d.upload_date.slice(0,7); const o=months[ym]=months[ym]||{n:0,words:0,tw:new Array(K).fill(0)};
    o.n++; o.words+=row.assigned; tids.forEach((t,i)=>{o.tw[i]+=(row.w[t]||0)*row.assigned;}); }
  const keys=Object.keys(months).sort(); const w=h("div");
  if(!keys.length) return h("div",{class:"unavail"},"No dated lectures with topic weights.");
  const all=[]; let [y,mo]=keys[0].split("-").map(Number); const [y2,m2]=keys[keys.length-1].split("-").map(Number);
  while(y<y2||(y===y2&&mo<=m2)){ all.push(y+"-"+String(mo).padStart(2,"0")); mo++; if(mo>12){mo=1;y++;} }
  const gaps=all.filter(k=>!months[k]);
  if(gaps.length) w.append(h("div",{class:"warn"},"Publication coverage is incomplete: "+gaps.length+" of "+all.length+" months in the span have no lectures in this corpus ("+gaps.join(", ")+"). A change across a gap reflects which videos were downloaded, not necessarily a change in topic."));
  w.append(h("p",{class:"note small"},"Coverage reflects only the downloaded lectures. Months with fewer than 3 lectures are marked and are weak evidence."));
  w.append(h("div",{class:"row"},h("label",null,"View"),
    h("select",{on:{change:e=>{C.view=e.target.value;render();}}},[["norm","normalized (share of month)"],["abs","absolute (topic-weighted words)"]].map(([v,l])=>h("option",{value:v,selected:C.view===v},l))),
    h("label",null,"Topic bars"),h("select",{on:{change:e=>{C.topic=e.target.value;render();}}},tids.map(t=>h("option",{value:t,selected:t===C.topic},t)))));
  const ti=tids.indexOf(C.topic), val=(k,i)=>C.view==="norm"?months[k].tw[i]/(months[k].words||1):months[k].tw[i];
  const mx=Math.max(1e-9,...keys.map(k=>val(k,ti)));
  w.append(h("table",null,h("tr",null,h("th",null,"month"),h("th",{class:"num"},"lectures"),h("th",{class:"num"},"words"),h("th",null,C.topic+" ("+C.view+")")),
    all.map(k=>months[k]?h("tr",null,h("td",null,k+(months[k].n<3?"  (low n)":"")),h("td",{class:"num"},months[k].n),h("td",{class:"num"},months[k].words),
      h("td",null,h("div",{style:"display:flex;gap:8px;align-items:center"},h("div",{class:"bar",style:"width:"+Math.round(val(k,ti)/mx*360)+"px"}),
        h("span",{class:"meta"},C.view==="norm"?(val(k,ti)*100).toFixed(1)+"%":Math.round(val(k,ti)))))):
      h("tr",null,h("td",{style:"color:var(--warn)"},k),h("td",{class:"num"},0),h("td",{class:"num"},0),h("td",{class:"meta"},"no lectures")))));
  w.append(h("h2",null,"All topics by month"));
  const cm = tids.map((t,i)=>Math.max(1e-9,...keys.map(k=>val(k,i))));
  const tb=h("table",{class:"small"},h("tr",null,h("th",null,"month"),tids.map(t=>h("th",null,t))));
  for(const k of all){ if(!months[k]) continue;
    tb.append(h("tr",null,h("td",null,k),tids.map((t,i)=>{const a=Math.pow(val(k,i)/cm[i],0.75);
      return h("td",{style:"background:rgba(85,224,125,"+(0.04+0.96*a).toFixed(3)+");color:"+(a>0.55?"#000":"var(--text)"),title:t+": "+(C.view==="norm"?(val(k,i)*100).toFixed(1)+"%":Math.round(val(k,i)))},"");}))); }
  w.append(h("div",{class:"scroll"},tb));
  return w;
}

/* ---------- concordance ---------- */
function conc(){
  const miss = unavailable("passages.csv"); if(miss) return miss;
  const ix=S.ix, c=S.conc, w=h("div"), m=curModel();
  const q=h("input",{type:"search",value:c.q,size:36,placeholder:"word or phrase"});
  const scope=h("select",null,h("option",{value:""},"entire corpus"),ix.docs.map(d=>h("option",{value:d.video_id,selected:c.scope===d.video_id},d.upload_date+"  "+d.title.slice(0,70))));
  const tsel=h("select",null,h("option",{value:""},"any topic"),
    m?m.topics.map(t=>h("option",{value:t.topic_id,selected:c.topic===t.topic_id},t.topic_id+(topicLabel(m.id,t.topic_id)?"  "+topicLabel(m.id,t.topic_id):""))):[]);
  const ex=h("input",{type:"checkbox",checked:c.exact}), cs=h("input",{type:"checkbox",checked:c.cs});
  const out=h("div");
  const go=()=>{ c.q=q.value; c.scope=scope.value; c.topic=tsel.value; c.exact=ex.checked; c.cs=cs.checked; out.replaceChildren(runSearch()); };
  q.addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  w.append(h("div",{class:"row"},q,h("button",{class:"btn",on:{click:go}},"search"),h("label",null,"in"),scope,
    h("label",null,"passages dominated by"),tsel,h("label",null,ex," whole words"),h("label",null,cs," case sensitive")));
  w.append(h("p",{class:"note small"},"Searches the faithful passage text, including passages excluded from topic modeling (these are marked). Frequency counts every occurrence; distinct lectures counts lectures containing at least one."));
  w.append(out); if(c.q) out.append(runSearch());
  return w;
}
function runSearch(){
  const ix=S.ix, c=S.conc, w=h("div"); if(!c.q.trim()) return w;
  const body=c.q.trim().split(/\s+/).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("\\s+");
  const re=new RegExp(c.exact?"\\b"+body+"\\b":body, c.cs?"g":"gi");
  const m=curModel(), ptm=m?(ix.pt[m.id]||{}):{};
  let total=0; const docs=new Set(); const hits=[];
  for(const p of ix.passages){
    if(c.scope && p.video_id!==c.scope) continue;
    if(c.topic){ const wt=ptm[p.passage_id]; if(!wt) continue;
      let best=null,bv=-1; for(const [t,v] of Object.entries(wt)) if(v>bv){bv=v;best=t;} if(best!==c.topic) continue; }
    re.lastIndex=0; const n=(p.text.match(re)||[]).length; if(!n) continue;
    total+=n; docs.add(p.video_id); hits.push(p);
  }
  w.append(h("p",null,"occurrences: "+total+"   |   distinct lectures: "+docs.size+"   |   passages: "+hits.length+(hits.length>150?"   (showing first 150)":"")));
  for(const p of hits.slice(0,150)) w.append(passageBlock(p,{highlight:new RegExp(re.source,re.flags)}));
  return w;
}

/* ---------- model comparison ---------- */
function models(){
  const miss = unavailable("topics.csv","topic_terms.csv"); if(miss) return miss;
  const ix=S.ix, w=h("div"), man=S.raw["manifest.json"], rep=S.raw["report.json"];
  const corp=new Set(ix.models.map(m=>m.id.split("-")[1]));
  if(corp.size>1) w.append(h("div",{class:"warn"},"These models were fitted on different corpus snapshots ("+[...corp].join(", ")+"). Compare them with care: topic identifiers and meanings are not shared."));
  if(ix.models.some(m=>m.kind==="frozen")) w.append(h("p",{class:"note small"},"Frozen models classify the current passages with a model fitted on an earlier snapshot. Refitted models may discover different categories."));
  w.append(h("h2",null,"Models"));
  const repm=Object.fromEntries(((rep&&rep.models)||[]).map(x=>[x.model_id,x]));
  w.append(h("table",null,h("tr",null,["K","kind","model id","converged","iterations","reconstruction error"].map(x=>h("th",null,x))),
    ix.models.map(m=>{const r=repm[m.id]||{}; return h("tr",null,h("td",{class:"num"},m.K),h("td",null,m.kind),h("td",null,m.id),
      h("td",null,r.converged==null?"":String(r.converged)),h("td",{class:"num"},r.n_iter??""),h("td",{class:"num"},r.reconstruction_err!=null?(+r.reconstruction_err).toFixed(3):""));})));
  w.append(h("h2",null,"Where a topic goes in the other models"));
  const m=curModel(); const tsel=h("select",null,m.topics.map(t=>h("option",{value:t.topic_id},t.topic_id)));
  const out=h("div"); const show=()=>out.replaceChildren(overlap(m,tsel.value));
  tsel.addEventListener("change",show);
  w.append(h("div",{class:"row"},h("label",null,"Topic in selected model"),tsel),
    h("p",{class:"note small"},"Overlap is the Jaccard index of the top 20 terms. It compares vocabulary only, so a split or merged topic shows up as several partial matches rather than one."),out);
  show();
  w.append(h("h2",null,"Stability metrics"));
  const sm=S.raw["stability.csv"];
  if(!sm) w.append(unavailable("stability.csv"));
  else if(!sm.rows.length) w.append(h("div",{class:"unavail"},"stability.csv is present but empty: run the stability stage and export again. No values are shown in its place."));
  else {
    const groups={}; for(const r of sm.rows) (groups[r.comparison]=groups[r.comparison]||[]).push(r);
    const names={repeat_fit:"Repeated fits (primary fit vs random-init refits)",topic_count:"Different topic counts",alternative_representation:"Alternative representation"};
    for(const [k,rows] of Object.entries(groups)){
      w.append(h("h3",{style:"margin:16px 0 4px;color:var(--hi);font-size:14px"},names[k]||k));
      w.append(h("table",{class:"small"},h("tr",null,["model A","model B","metric","value"].map(x=>h("th",null,x))),
        rows.map(r=>h("tr",null,h("td",null,r.model_a),h("td",null,r.model_b),h("td",null,r.metric),h("td",{class:"num"},(+r.value).toFixed(3))))));
      if(rows[0]) w.append(h("p",{class:"meta"},rows[0].note));
    }
  }
  return w;
}
function overlap(m,tid){
  const ix=S.ix, top=(mid,t)=>new Set(((ix.terms[mid]||{})[t]||[]).slice(0,20).map(x=>x.term));
  const A=top(m.id,tid), w=h("div");
  w.append(h("p",{class:"terms"},[...A].join(", ")));
  for(const o of ix.models){ if(o.id===m.id) continue;
    const sc=o.topics.map(t=>{const B=top(o.id,t.topic_id); let i=0; for(const x of A) if(B.has(x)) i++; return {t:t.topic_id,j:i/(A.size+B.size-i||1),B};}).sort((a,b)=>b.j-a.j).slice(0,3);
    w.append(h("div",{class:"meta",style:"margin-top:8px"},"K="+o.K+" "+o.kind));
    w.append(h("table",{class:"small"},sc.map(s=>h("tr",null,h("td",null,s.t),h("td",{class:"num"},s.j.toFixed(2)),h("td",null,[...s.B].slice(0,10).join(", "))))));
  }
  return w;
}
